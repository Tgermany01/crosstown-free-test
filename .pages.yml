# Pages CMS (https://pagescms.org) config: a free, Git-based editor.
# Sign in at app.pagescms.org with GitHub and open this repo.
media:
  input: public/images
  output: /images
content:
  - name: posts
    label: Blog posts
    type: collection
    path: src/content/posts
    filename: '{fields.title}.md'
    view:
      fields: [title, date]
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: date, label: Date, type: date, required: true }
      - { name: category, label: Category, type: string }
      - { name: description, label: Summary (for search results), type: text }
      - { name: body, label: Post, type: rich-text }
  - name: copy
    label: Page text
    type: collection
    path: src/copy
    fields:
      - { name: body, label: Text, type: rich-text }
